version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      dev-tooling:
        dependency-type: development
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/data"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
