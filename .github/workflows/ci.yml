name: CI

env:
  PYTHONUNBUFFERED: 1

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/README.md'
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install linters
        run: uv sync --locked --only-group lint

      - name: ruff format
        run: uv run --no-sync ruff format --check --diff .

      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github .

      - name: mypy
        run: uv run --no-sync mypy

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.13'
          - os: macos-15-intel
            python-version: '3.13'
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Setup SDR drivers (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          choco install wget --no-progress
          wget -nv -O windrivers.zip https://github.com/jopohl/sdrbuild/releases/download/v1.1/win-x64.zip
          7z x windrivers.zip -osrc/urh/dev/native/lib/shared
          ls src/urh/dev/native/lib/shared
        shell: bash

      - name: Install native SDR libraries
        run: data/ci/install_sdr_libs.sh
        shell: bash

      - name: Install dependencies and build Cython extensions
        run: uv sync --locked --group audio

      - name: Run pytest with coverage
        if: ${{ startsWith(matrix.os, 'ubuntu') && matrix.python-version == '3.12' }}
        run: |
          touch tests/show_gui
          uv run pytest --junitxml=junit/test-results.xml --cov --cov-report=xml --cov-report=html tests

      - name: Run pytest
        if: ${{ !(startsWith(matrix.os, 'ubuntu') && matrix.python-version == '3.12') }}
        run: uv run pytest --junitxml=junit/test-results.xml tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: junit/test-results.xml

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Build sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  wheels:
    name: Wheels (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: macos-arm64
            os: macos-latest
          - name: macos-x86_64
            os: macos-15-intel
          - name: windows-x86_64
            os: windows-latest
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Setup SDR drivers (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          choco install wget --no-progress
          wget -nv -O windrivers.zip https://github.com/jopohl/sdrbuild/releases/download/v1.1/win-x64.zip
          7z x windrivers.zip -osrc/urh/dev/native/lib/shared
          ls src/urh/dev/native/lib/shared
        shell: bash

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.0

      - uses: actions/upload-artifact@v7
        with:
          name: dist-wheels-${{ matrix.name }}
          path: wheelhouse/*.whl

  check-wheel:
    name: Smoke test Linux wheel
    runs-on: ubuntu-latest
    needs: wheels
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
          enable-cache: true

      - uses: actions/download-artifact@v7
        with:
          name: dist-wheels-linux-x86_64
          path: dist

      - name: Install GUI runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 x11-utils libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libegl1 libxcb-cursor0 libhackrf0 librtlsdr0

      - name: Install and run the wheel
        run: |
          uv venv --python 3.12 /tmp/wheelcheck
          uv pip install --python /tmp/wheelcheck dist/urh-*-cp312-*.whl
          /tmp/wheelcheck/bin/urh --version
          xvfb-run /tmp/wheelcheck/bin/urh autoclose
          /tmp/wheelcheck/bin/python data/check_native_backends.py

  installers:
    name: Installer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: windows-exe
            os: windows-latest
          - name: macos-arm64-dmg
            os: macos-latest
          - name: macos-x86_64-dmg
            os: macos-15-intel
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Setup SDR drivers (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          choco install wget --no-progress
          wget -nv -O windrivers.zip https://github.com/jopohl/sdrbuild/releases/download/v1.1/win-x64.zip
          7z x windrivers.zip -osrc/urh/dev/native/lib/shared
          ls src/urh/dev/native/lib/shared
        shell: bash

      - name: Install native SDR libraries
        if: startsWith(matrix.os, 'macos')
        run: data/ci/install_sdr_libs.sh
        shell: bash

      - name: Install dependencies and build Cython extensions
        run: uv sync --locked --group audio

      - name: Build .exe installer
        if: startsWith(matrix.os, 'windows')
        run: |
          uv run python data/pyinstaller_helper.py
          for /f %%i in ('uv run python src/urh/version.py') do set URHVERSION=%%i
          iscc /dMyAppVersion=%URHVERSION% /dArch=x64 data/inno.iss
        shell: cmd

      - name: Check urh_debug.exe
        if: startsWith(matrix.os, 'windows')
        run: |
          cd pyinstaller\urh
          urh_debug.exe autoclose
        shell: cmd

      - name: Build DMG
        if: startsWith(matrix.os, 'macos')
        run: |
          cp data/pyinstaller_macos.spec urh.spec
          uv run pyinstaller --clean --distpath ./pyinstaller --workpath ./urh_build urh.spec
          mkdir -p dist
          cat pyinstaller/main.app/Contents/Info.plist
          hdiutil create -volname Universal.Radio.Hacker \
                         -srcfolder pyinstaller/main.app \
                         -ov -format UDZO \
                         "dist/Universal.Radio.Hacker-$(uv run python src/urh/version.py)-$(uname -m).dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-installer-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
