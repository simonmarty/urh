name: Release

env:
  PYTHONUNBUFFERED: 1

on:
  push:
    tags: [ "v*" ]

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
          enable-cache: true

      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - run: ls -l dist

      - name: Attach installers to the GitHub release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*.exe,dist/*.dmg"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          generateReleaseNotes: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true

      # TODO: migrate to PyPI Trusted Publishing (OIDC) to drop these long-lived
      # credentials. 
      - name: Upload to PyPI
        run: uv publish --check-url https://pypi.org/simple/ dist/*.whl dist/*.tar.gz
        env:
          UV_PUBLISH_USERNAME: ${{ secrets.TWINE_USERNAME }}
          UV_PUBLISH_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
          UV_PUBLISH_URL: "https://upload.pypi.org/legacy/"
