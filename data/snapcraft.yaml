name: urh
title: Universal Radio Hacker
summary: Investigate Wireless Protocols Like A Boss
description: |
  The Universal Radio Hacker (URH) is a complete suite for wireless protocol investigation with native support for many common **Software Defined Radios**.
  URH allows **easy demodulation** of signals combined with an automatic detection of modulation parameters making it a breeze to identify the bits and bytes that fly over the air.
  As data often gets _encoded_ before transmission, URH offers **customizable decodings** to crack even sophisticated encodings like CC1101 data whitening.
  When it comes to **protocol reverse-engineering**, URH is helpful in two ways. You can either manually assign protocol fields and message types or let URH **automatically infer protocol fields** with a rule-based intelligence.
  Finally, URH entails a **fuzzing component** aimed at stateless protocols and a **simulation environment** to perform stateful attacks.

  After installation, give URH access to your USB in order to access your USB based SDRs:

     sudo snap connect urh:raw-usb

  In order to access your SDR as non-root user, install the according **udev rules** available at https://github.com/jopohl/urh/wiki/SDR-udev-rules.

  If you want to use your Soundcard as an SDR for receiving please execute:

     sudo snap connect urh:audio-record

icon: data/icons/appicon.png

adopt-info: urh

grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict # use 'strict' once you have the right plugs and slots
base: core24

platforms:
  amd64:

apps:
  urh:
    extensions: [gnome]
    command-chain: [snap/command-chain/alsa-launch]
    command: bin/urh
    plugs:
      - home
      - raw-usb
      - audio-playback
      - audio-record
      - network
    environment:
      LD_PRELOAD: $SNAP/lib/semwraplib.so
      BLADERF_SEARCH_DIR: $SNAP/bladefpgas

layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib

parts:
  alsa-mixin:
    plugin: dump
    source: https://github.com/diddlesnaps/snapcraft-alsa.git
    source-subdir: snapcraft-assets
    build-packages:
      - libasound2-dev

  semwraplib:
    plugin: nil
    source: data
    override-build: |
      craftctl default
      mkdir -p $CRAFT_PART_INSTALL/lib
      gcc -g -O0 -Wall -Wstrict-prototypes -fPIC -shared semwraplib.c -o $CRAFT_PART_INSTALL/lib/semwraplib.so -ldl
    build-packages:
      - build-essential

  urh:
    after: [alsa-mixin]
    plugin: uv
    source: .
    build-snaps: [astral-uv]
    uv-groups: [snap]
    override-pull: |
      craftctl default
      craftctl set version="$(python3 src/urh/version.py)"
    override-build: |
      git clone https://github.com/Nuand/bladeRF.git
      cd bladeRF/host
      mkdir build
      cmake -DCMAKE_INSTALL_PREFIX=$CRAFT_PART_INSTALL ..
      make -j$(nproc)
      make install
      cmake -DCMAKE_INSTALL_PREFIX=/usr ..
      make install
      cd $CRAFT_PART_SRC
      craftctl default
    build-packages:
      - libairspy-dev
      - libhackrf-dev
      - libiio-dev
      - liblimesuite-dev
      - librtlsdr-dev
      - libuhd-dev
      - portaudio19-dev
      - wget
      - execstack
      - build-essential
      - cmake
      - pkg-config
    stage-packages:
      - libairspy-dev
      - libhackrf-dev
      - libiio-dev
      - liblimesuite-dev
      - librtlsdr-dev
      - libuhd-dev
      - libgomp1
      - libportaudio2
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-sync1
      - libxcb-xfixes0
      - libxcb-xinerama0
      - libxkbcommon-x11-0
      - libegl1
      - libglx0
      - libfontconfig1
      - libdbus-1-3
      - libmd4c0
      - libasound2t64
      - libasound2-plugins
      - locales-all
      - xdg-user-dirs

  bladerf-fpga:
    plugin: dump
    source: .
    override-build: |
      craftctl default
      wget https://www.nuand.com/fpga/v0.11.0/hostedxA4.rbf  -P $CRAFT_PART_INSTALL/bladefpgas
      wget https://www.nuand.com/fpga/v0.11.0/hostedxA9.rbf  -P $CRAFT_PART_INSTALL/bladefpgas
      wget https://www.nuand.com/fpga/v0.11.0/hostedx40.rbf  -P $CRAFT_PART_INSTALL/bladefpgas
      wget https://www.nuand.com/fpga/v0.11.0/hostedx115.rbf -P $CRAFT_PART_INSTALL/bladefpgas
    build-packages:
      - wget
